<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV to JSON - ETL Exercise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Student Information Header -->
        <div class="header-section">
            <h1 id="studentName">Athena Jamie Uy</h1>
            <h3 id="studentSchedule"><i>IT 3206N MW 6:00 - 8:30 PM</i></h3>
        </div>

        <h1 class="app-title">ETL Exercise</h1>

        <!-- Step 1: Upload Source CSV Files -->
        <div class="step-section">
            <h2>1. Upload Source CSV Files</h2>
            <div class="upload-grid">
                <div class="upload-item">
                    <label for="sisFile">Student Information System (SIS):</label>
                    <input type="file" id="sisFile" accept=".csv,text/csv">
                </div>

                <div class="upload-item">
                    <label for="lmsFile">Learning Management System (LMS):</label>
                    <input type="file" id="lmsFile" accept=".csv,text/csv">
                </div>

                <div class="upload-item">
                    <label for="accountingFile">Accounting System:</label>
                    <input type="file" id="accountingFile" accept=".csv,text/csv">
                </div>
            </div>

            <div class="actions-row">
                <button id="runButton" class="btn btn-primary" onclick="runETL()">RUN ETL</button>
                <p id="status" class="status-msg">Upload the three CSV files and click RUN ETL.</p>
            </div>
        </div>

        <!-- Step 2: JSON Output -->
        <div class="step-section">
            <div class="output-header">
                <h2>2. JSON Output</h2>
                <div class="output-tools">
                    <button type="button" class="btn btn-outline" onclick="copyJSON()">Copy JSON</button>
                    <button type="button" class="btn btn-outline" onclick="downloadJSON()">Download JSON</button>
                    <span id="copyFeedback" class="toast-msg">Copied!</span>
                </div>
            </div>
            <pre id="jsonOutput">Upload the CSV files and click RUN ETL.</pre>
        </div>
    </div>

    <!-- External ETL Logic -->
    <script src="script.js"></script>
</body>
</html>
